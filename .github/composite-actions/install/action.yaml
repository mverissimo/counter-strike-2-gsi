name: "Install"
description: "Sets up Vite+ with Node.js and installs dependencies"

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version: "24"
        cache: true

    - name: Install dependencies
      shell: bash
      run: vp install
