  "@testing-library/react": ^16.3.2
  "@types/bun": ^1.3.12
  "@types/express": ^5.0.6
  "@types/node": ^24
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  arktype: ^2.2.0
  bun: ^1.3.12
  express: ^5.2.1
  fast-deep-equal: ^3.1.3
  fastify: ^5.8.4
  happy-dom: ^20.8.9
  hono: ^4.12.12
  microdiff: ^1.5.0
  react: ^19.2.5
  react-dom: ^19.2.5
  type-fest: ^5.5.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.1.16
  vitest: npm:@voidzero-dev/vite-plus-test@latest

overrides:
