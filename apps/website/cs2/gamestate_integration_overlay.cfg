// Counter-Strike 2 Game State Integration config for the example overlay.
//
// Copy this file to:
//   Windows  ...\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
//   Linux    ~/.steam/steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/cfg/
//   macOS    ~/Library/Application Support/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/cfg/
//
// The filename must start with "gamestate_integration_". Restart CS2 after
// copying — it only reads these on launch.

"CS2 Example Overlay"
{
    // The GSI server listens on 3000 in development and in OBS alike, so this
    // never has to change — which matters, because CS2 only reads this file at
    // launch.
    "uri"       "http://127.0.0.1:3000/gsi"
    "timeout"   "5.0"

    // `throttle` is the floor on the interval between posts. 0.1 gives ~10 Hz;
    // 0.0 lets CS2 post every tick (~64 Hz), which is ~6x the payload volume
    // for a HUD whose fastest-moving number is a tenth-of-a-second countdown.
    // Raise it, don't lower it, unless you are drawing positions.
    "buffer"    "0.1"
    "throttle"  "0.1"
    "heartbeat" "10.0"

    // No "auth" block: the endpoint is loopback-only and the sole thing that
    // should reach it is CS2 on this machine, so a shared secret between two
    // local processes adds a failure mode without adding safety. If you expose
    // the endpoint beyond localhost, add one here and pass a matching `token`
    // to `createGSIBun` in server/manager.ts:
    //
    //   "auth" { "token" "your-token" }

    // Exactly what this overlay draws, and nothing else. Every extra key is
    // more payload to validate, merge and diff on every tick.
    "data"
    {
        "provider"                  "1"   // game, appid, timestamp
        "map"                       "1"   // mode, name, phase, scores
        "map_round_wins"            "1"   // RoundHistory — separate from "map"
        "round"                     "1"   // phase, bomb, win_team
        "player_id"                 "1"   // steamid, name, team
        "player_state"              "1"   // health, armor, money, kills
        "player_weapons"            "1"   // active weapon + ammo
        "player_match_stats"        "1"   // kills, deaths, assists, mvps
        "allplayers_id"             "1"   // full roster — spectator only
        "allplayers_state"          "1"
        "allplayers_match_stats"    "1"
        "allplayers_weapons"        "1"
        "bomb"                      "1"   // plant/defuse state + countdown
        "phase_countdowns"          "1"   // round/freezetime/bomb timers

        // Valid, and the schema accepts them — this overlay just never reads
        // them. Turn on only if you add a radar or a grenade tracker.
        // "player_position"        "1"
        // "allplayers_position"    "1"
        // "allgrenades"            "1"
    }
}
